// ── HuntSoundManager ─────────────────────────────────────────────────────────
class HuntSoundManager {
  constructor(){ this._ctx=null; this._timer=null; this._active=false; }
  _ctx(){
    if(!this._ctx) this._ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(this._ctx.state==='suspended') this._ctx.resume();
    return this._ctx;
  }
  _pulse(ctx,freq,vol,startAt,dur){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0,startAt);
    g.gain.linearRampToValueAtTime(vol,startAt+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,startAt+dur);
    o.start(startAt); o.stop(startAt+dur+0.05);
  }
  _beat(){
    if(!this._active) return;
    const ctx=this._ctx(), now=ctx.currentTime;
    this._pulse(ctx,58,0.55,now,0.13);        // lub
    this._pulse(ctx,48,0.38,now+0.2,0.15);   // dub
    this._timer=setTimeout(()=>this._beat(),850);
  }
  start(){ if(this._active) return; this._active=true; this._beat(); }
  stop(){ this._active=false; clearTimeout(this._timer); this._timer=null; }
}

// ── VanToolShelf ──────────────────────────────────────────────────────────────
const TOOL_DEFS = [
  {id:'emf',        label:'EMF Reader',   x:-3.8, z:6.5,  color:0x00ff88},
  {id:'thermometer',label:'Thermometer',  x:-3.8, z:8.0,  color:0x00aaff},
  {id:'goggles',    label:'Night Goggles',x:-3.8, z:9.5,  color:0x88ff00},
  {id:'uv',         label:'UV Light',     x:-3.8, z:11.0, color:0x8800ff},
  {id:'notebook',   label:'Notebook',     x: 3.8, z:6.5,  color:0xffaa00},
  {id:'sensor',     label:'Motion Sensor',x: 3.8, z:8.0,  color:0xff4400},
  {id:'spiritbox',  label:'Spirit Box',   x: 3.8, z:9.5,  color:0xff00aa},
];

class VanToolShelf {
  constructor(scene) {
    this._scene=scene;
    this._pickups=[];
    this._build();
  }
  _build() {
    const shelfMat=new THREE.MeshStandardMaterial({color:0x1a0e05,roughness:0.9});
    for(const def of TOOL_DEFS){
      const shelf=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.05,0.45),shelfMat);
      shelf.position.set(def.x,0.97,def.z); this._scene.add(shelf);
      const mat=new THREE.MeshStandardMaterial({color:def.color,emissive:def.color,emissiveIntensity:0.4,roughness:0.5});
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.28,0.16),mat);
      mesh.position.set(def.x,1.18,def.z); this._scene.add(mesh);
      const light=new THREE.PointLight(def.color,0.5,1.8);
      light.position.set(def.x,1.35,def.z); this._scene.add(light);
      this._pickups.push({id:def.id,label:def.label,mesh,light,available:true,pos:new THREE.Vector3(def.x,1.18,def.z)});
    }
  }
  getNearby(playerPos,range=1.6){ return this._pickups.find(p=>p.available&&playerPos.distanceTo(p.pos)<range)||null; }
  take(p){ p.available=false; p.mesh.visible=false; p.light.intensity=0; }
  return(toolId){ const p=this._pickups.find(p=>p.id===toolId); if(p){p.available=true;p.mesh.visible=true;p.light.intensity=0.5;} }
}

// ── ToolManager ───────────────────────────────────────────────────────────────
class ToolManager {
  constructor(camera,scene,hud,sceneManager,game){
    this.camera=camera; this.hud=hud; this.game=game;
    this._active=null; this._inventory=[null,null]; this._activeSlot=0;
    this._curRoomId='van'; this._shelf=null;
    this.tools={
      emf:new EMFReader(hud),
      thermometer:new Thermometer(hud),
      goggles:new NightVisionGoggles(hud,sceneManager,scene),
      uv:new UVFlashlight(camera,scene,hud),
      notebook:new Notebook(scene,hud,game),
      sensor:new MotionSensor(scene,hud,game),
      spiritbox:new SpiritBox(hud,game),
    };
    document.addEventListener('keydown',e=>{
      if(e.code==='Digit1') this._selectSlot(0);
      else if(e.code==='Digit2') this._selectSlot(1);
      else if(e.code==='KeyG') this._drop();
      else if(e.code==='KeyE') this._interact();
    });
  }
  setShelf(shelf){ this._shelf=shelf; }
  _selectSlot(idx){
    const id=this._inventory[idx]; if(!id) return;
    if(this._active===id&&id==='goggles'){this.tools.goggles.toggle();return;}
    if(this._active) this.tools[this._active]?.onUnequip?.();
    this._activeSlot=idx; this._active=id;
    this.tools[id]?.onEquip?.(); this.game.sendToolHeld(id);
    this.hud.setInventory(this._inventory,this._activeSlot);
  }
  _interact(){
    if(this._curRoomId==='van'&&this._shelf){
      const nearby=this._shelf.getNearby(this.camera.position);
      if(nearby){ this._pickup(nearby); return; }
    }
    this.tools[this._active]?.onInteract?.(this.camera);
  }
  _pickup(pickup){
    const empty=this._inventory.findIndex(s=>s===null);
    if(empty!==-1){
      this._inventory[empty]=pickup.id; this._shelf.take(pickup);
      if(this._active===null) this._selectSlot(empty);
    } else {
      const dropped=this._inventory[this._activeSlot];
      this.tools[dropped]?.onUnequip?.();
      this._inventory[this._activeSlot]=pickup.id;
      this._shelf.take(pickup); this._shelf.return(dropped);
      this._active=pickup.id; this.tools[pickup.id]?.onEquip?.();
      this.game.sendToolHeld(pickup.id);
    }
    this.hud.showEvidencePopup(`Picked up: ${pickup.label}`);
    this.hud.setInventory(this._inventory,this._activeSlot);
  }
  _drop(){
    const id=this._inventory[this._activeSlot]; if(!id) return;
    this.tools[id]?.onUnequip?.();
    this._inventory[this._activeSlot]=null; this._active=null;
    this.game.sendToolHeld(null);
    if(this._curRoomId==='van'&&this._shelf){ this._shelf.return(id); this.hud.showEvidencePopup('Tool returned to shelf.'); }
    else this.hud.showEvidencePopup('Tool dropped.');
    this.hud.setInventory(this._inventory,this._activeSlot);
  }
  update(delta,roomId){
    this._curRoomId=roomId;
    this.tools[this._active]?.update?.(delta,roomId);
    if(roomId==='van'&&this._shelf){
      const nearby=this._shelf.getNearby(this.camera.position);
      if(nearby) this.hud.setInteractPrompt(`[E] Pick up ${nearby.label}  [G] Drop held tool`);
    }
  }
  onEMFUpdate(l){ this.tools.emf.onEMFUpdate(l); }
  onTemperature(t){ this.tools.thermometer.onTemperature(t); }
  onGhostOrbs(a){ this.tools.goggles.onGhostOrbs(a); }
  onFingerprintLocations(l){ this.tools.uv.onFingerprintLocations(l); }
  onWriting(d){ this.tools.notebook.onWriting(d); }
  onMotionSensor(d){ this.tools.sensor.onMotionSensorEvent(d); }
  onSpiritBoxResponse(d){ this.tools.spiritbox.onResponse(d); }
  onSensorPlaced(d){ this.tools.sensor.onSensorPlaced(d); }
  onNotebookPlaced(d){ this.tools.notebook.onNotebookPlaced(d); }
}

// ── LAN Multiplayer Client ────────────────────────────────────────────────────
class LANClient {
  constructor(game) {
    this.game = game;
    this.ws = null;
    this.playerId = null;
    this.otherPlayers = new Map();
    this.connected = false;
    this._tryConnect();
  }
  _tryConnect() {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const host = window.location.hostname;
    const port = window.location.port || (window.location.protocol === 'https:' ? 443 : 80);
    const wsUrl = `${proto}//${host}:3000`;
    try {
      this.ws = new WebSocket(wsUrl);
      this.ws.onopen = () => this._onOpen();
      this.ws.onmessage = (e) => this._onMessage(JSON.parse(e.data));
      this.ws.onclose = () => { this.connected = false; console.log('LAN disconnected'); };
      this.ws.onerror = () => { this.connected = false; };
    } catch (e) {
      console.log('LAN not available, playing offline');
    }
  }
  _onOpen() {
    this.connected = true;
    console.log('LAN connected');
    this.send({ type: 'join', name: document.getElementById('name-input').value || 'Player' });
  }
  _onMessage(msg) {
    if (msg.type === 'joined') {
      this.playerId = msg.playerId;
      for (const p of msg.players || []) {
        if (p.id !== this.playerId) this.otherPlayers.set(p.id, p);
      }
    } else if (msg.type === 'playerJoined') {
      if (msg.playerId !== this.playerId) this.otherPlayers.set(msg.playerId, msg.player);
    } else if (msg.type === 'playerLeft') {
      this.otherPlayers.delete(msg.playerId);
    }
  }
  send(msg) {
    if (this.connected && this.ws) this.ws.send(JSON.stringify(msg));
  }
  update(pos, rot, roomId, state) {
    this.send({ type: 'move', position: pos, rotation: rot, currentRoomId: roomId });
    this.send({ type: 'state', state });
  }
}

// ── Main ──────────────────────────────────────────────────────────────────────
const scene   = new SceneManager();
const rooms   = new RoomManager(scene.scene);
let houseDetails;
try { houseDetails = new HouseDetails(scene.scene); }
catch(e) { console.error('[HouseDetails crash]', e); }
const lights  = new LightingManager(scene.scene);
const ghost   = new GhostRenderer(scene.scene);
const player  = new PlayerController(scene.camera, scene.renderer.domElement);
const hud     = new HUD();
const tablet  = new MapTablet();
const game    = new LocalGame();
const clock   = new THREE.Clock();
const vanShelf = new VanToolShelf(scene.scene);
const huntSound = new HuntSoundManager();
scene.camera.position.set(0, PLAYER_HEIGHT, 9);

const journal = new Journal(ghostId => game.submitGuess(ghostId));
const toolMgr = new ToolManager(scene.camera, scene.scene, hud, scene, game);
toolMgr.tools.sensor.setMapTablet(tablet);
toolMgr.setShelf(vanShelf);
const lanClient = new LANClient(game);

let gameStarted = false, curRoomId = 'van', moveThrottle = 0;
let _prevRoomId = 'van';

// Lobby
document.getElementById('start-btn').addEventListener('click', () => {
  const name = document.getElementById('name-input').value.trim() || 'Detective';
  game.join(name);
  document.getElementById('lobby').style.display = 'none';
  game.startGame();
});
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.code === 'Enter') document.getElementById('start-btn').click();
});

// Game events
game.on('game:start', () => {
  gameStarted = true;
  hud.show();
  const displayId = lanClient.connected && lanClient.playerId ? `SESSION ${lanClient.playerId.substring(0, 8)}` : 'WHITTAKER HOUSE';
  document.getElementById('session-id').textContent = displayId;
  const cs = document.getElementById('click-start');
  cs.style.display = 'flex';
  cs.addEventListener('click', () => { cs.style.display = 'none'; player.lock(); }, { once: true });
});

game.on('state:sanity',   d => hud.setSanity(d.personal));
game.on('state:ghost',    d => { ghost.setTarget(d.position); ghost.setVisible(d.isVisible); });
game.on('evidence:emf',   d => toolMgr.onEMFUpdate(d.level));
game.on('evidence:temperature', d => toolMgr.onTemperature(d.temp));
game.on('evidence:ghostOrbs',   d => { toolMgr.onGhostOrbs(d.active); toolMgr.tools.goggles.setOrbOrigin(scene.camera.position); });
game.on('evidence:fingerprintLocations', l => toolMgr.onFingerprintLocations(l));
game.on('evidence:writing',       d => toolMgr.onWriting(d));
game.on('evidence:motionSensor',  d => toolMgr.onMotionSensor(d));
game.on('evidence:spiritBoxResponse', d => toolMgr.onSpiritBoxResponse(d));
game.on('evidence:sensorPlaced',  d => toolMgr.onSensorPlaced(d));
game.on('evidence:notebookPlaced',d => toolMgr.onNotebookPlaced(d));

game.on('event:huntWarning', d => {
  hud.showHuntWarning(true, `⚠ HUNT IN ${d.secsRemaining}s ⚠`);
  setTimeout(() => hud.showHuntWarning(false), (d.secsRemaining - 0.5) * 1000);
});
game.on('event:huntStart', () => { hud.showHuntWarning(true, '⚠ HUNT IN PROGRESS ⚠'); journal.hide(); tablet.hide(); huntSound.start(); });
game.on('event:huntEnd',   () => { hud.showHuntWarning(false); ghost.setVisible(false); game.sendHiding(false); player.exitCloset(); huntSound.stop(); });
game.on('event:playerDied', d => { document.getElementById('death-screen').style.display='flex'; player.isDead=true; });
game.on('event:powerToggle', d => { lights.setPower(d.enabled); hud.showEvidencePopup(d.enabled?'Power restored.':'Power cut!'); });
game.on('game:ended', d => { showEndScreen(d); journal.hide(); tablet.hide(); huntSound.stop(); });
game.on('game:incorrect', () => hud.showEvidencePopup('Incorrect — keep investigating.'));

document.getElementById('spectate-btn').addEventListener('click', () => {
  document.getElementById('death-screen').style.display = 'none';
  player.becomeSpectator();
});

// E key: fuse box, closet hiding
document.addEventListener('keydown', e => {
  if (e.code !== 'KeyE' || journal.isVisible()) return;
  const pos = scene.camera.position;
  // Fuse box
  if (curRoomId === 'boiler_room') {
    const fb = ROOM_MAP['boiler_room'].fuseBoxPos;
    if (fb && Math.sqrt((pos.x-fb.x)**2+(pos.z-fb.z)**2) < 2.5) { game.togglePower(); return; }
  }
  // Closet
  const room = ROOM_MAP[curRoomId];
  if (!room) return;
  if (player.isHiding) { player.exitCloset(); game.sendHiding(false); return; }
  const cp = room.closetPos;
  if (Math.sqrt((pos.x-cp.x)**2+(pos.z-cp.z)**2) < 1.2) { player.enterCloset(room); game.sendHiding(true); hud.setInteractPrompt('[E] Exit closet'); }
});

// Game loop
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (gameStarted) {
    player.onStairTransition((destId, destPos) => {
      scene.camera.position.set(destPos.x, destPos.y, destPos.z);
      curRoomId = destId;
    });
    player.update(delta, curRoomId);
    _prevRoomId = curRoomId;
    curRoomId = rooms.updateCurrentRoom(scene.camera.position.x, scene.camera.position.y, scene.camera.position.z);

    // Lock van door during hunts — block crossing in both directions
    if(game.vanDoorLocked){
      const crossedIn  = _prevRoomId==='van'   && curRoomId==='foyer';
      const crossedOut = _prevRoomId!=='van'   && curRoomId==='van';
      if(crossedIn){ scene.camera.position.z=4.6; curRoomId='van'; hud.showEvidencePopup('EXIT LOCKED — hunt in progress.'); }
      if(crossedOut){ scene.camera.position.z=3.4; curRoomId=_prevRoomId; hud.showEvidencePopup('EXIT LOCKED — hunt in progress.'); }
    }

    moveThrottle += delta;
    if (moveThrottle >= 0.05) {
      moveThrottle = 0;
      if (!player.isDead) {
        const euler = new THREE.Euler().setFromQuaternion(scene.camera.quaternion, 'YXZ');
        game.sendMove(scene.camera.position, euler.y, curRoomId);
        lanClient.update(scene.camera.position, { y: euler.y }, curRoomId, { sanity: game._sanity });
      }
    }

    const rd = rooms.getRoomData(curRoomId);
    if (rd) hud.setRoom(rd.name);

    // Interact prompts
    const pos = scene.camera.position;
    if (curRoomId === 'boiler_room') {
      const fb = ROOM_MAP['boiler_room'].fuseBoxPos;
      if (fb && Math.sqrt((pos.x-fb.x)**2+(pos.z-fb.z)**2) < 2.5) hud.setInteractPrompt('[E] Toggle power');
      else if (!player.isHiding) hud.setInteractPrompt('');
    } else if (!player.isHiding) {
      const room = ROOM_MAP[curRoomId];
      if (room) { const cp=room.closetPos; Math.sqrt((pos.x-cp.x)**2+(pos.z-cp.z)**2)<1.2 ? hud.setInteractPrompt('[E] Hide in closet') : hud.setInteractPrompt(''); }
    }

    toolMgr.update(delta, curRoomId);
    ghost.update(delta);
    if (ghost.isVisible()) {
      const gp = ghost.getPosition(), cp = scene.camera.position;
      const dx = gp.x-cp.x, dy = gp.y-cp.y, dz = gp.z-cp.z;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
      const toGhost = new THREE.Vector3(dx,dy,dz).normalize();
      const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(scene.camera.quaternion);
      game.sendLookingAtGhost(dist < 12 && toGhost.dot(camDir) > 0.7);
    } else {
      game.sendLookingAtGhost(false);
    }
  }
  scene.render();
}
animate();
</script>
