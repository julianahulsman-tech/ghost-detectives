<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ghost Detectives</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #ccc; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
#crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.7); font-size: 22px; line-height: 1; text-shadow: 0 0 4px #000; }
#hud-topleft { position: absolute; top: 14px; left: 14px; font-size: 13px; max-width: 340px; }

#hunt-warning { color: #f44; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #f00; display: none; animation: pulse 1s infinite; }
#hud-topright { position: absolute; top: 14px; right: 14px; text-align: right; font-size: 12px; color: #999; }
#hud-bottom { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px; }
#sanity-block { font-size: 13px; }
#sanity-label { color: #aaa; margin-bottom: 3px; }
#sanity-bar-wrap { width: 140px; height: 8px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); }
#sanity-bar { height: 100%; background: #7f7; transition: width 1s, background 1s; }
#sanity-pct { font-size: 12px; color: #7f7; margin-top: 2px; }
#tool-bar { display: flex; gap: 6px; }
.tool-slot { width: 64px; height: 56px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tool-slot.active { border-color: #fff; background: rgba(255,255,255,0.08); }
.tool-slot.filled { border-color: #6cf; }
.tool-slot.active.filled { border-color: #fff; }
.tool-slot .slot-key { font-size: 9px; color: #555; }
.tool-slot .slot-name { font-size: 10px; color: #bbb; text-align: center; }
.tool-slot.active .slot-name { color: #fff; }
.tool-slot .slot-empty { font-size: 9px; color: #444; }
#tool-readout { font-size: 12px; color: #6cf; margin-bottom: 4px; text-align: center; }
#hud-bottomright { text-align: right; font-size: 12px; color: #999; }
#room-name { color: #bbb; }
#temp-display { color: #6cf; margin-top: 2px; }
#interact-prompt { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 10px; display: none; }
#lobby { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 100; }
#lobby h1 { font-size: 36px; color: #c33; letter-spacing: 4px; }
#lobby h2 { font-size: 14px; color: #777; letter-spacing: 2px; }
#lobby input { background: rgba(255,255,255,0.1); border: 1px solid #555; color: #eee; padding: 8px 14px; font-size: 15px; font-family: 'Courier New', monospace; text-align: center; width: 220px; }
#lobby input:focus { outline: none; border-color: #c33; }
.lobby-btn { background: #c33; color: #fff; border: none; padding: 10px 28px; font-size: 15px; cursor: pointer; font-family: 'Courier New', monospace; letter-spacing: 1px; }
.lobby-btn:hover { background: #e44; }
.lobby-btn:disabled { background: #555; cursor: default; }
#journal { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: none; z-index: 50; padding: 40px; overflow-y: auto; pointer-events: all; }
#journal h2 { color: #c33; margin-bottom: 20px; letter-spacing: 2px; font-size: 20px; }
#journal-inner { display: flex; gap: 40px; }
#evidence-list, #ghost-list { flex: 1; }
#journal h3 { color: #888; font-size: 13px; margin-bottom: 12px; letter-spacing: 1px; }
.evidence-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; padding: 4px; }
.evidence-row:hover { background: rgba(255,255,255,0.05); }
.ev-state { width: 22px; height: 22px; border: 1px solid #555; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.ev-state.confirmed { border-color: #4f4; color: #4f4; }
.ev-state.ruledout { border-color: #f44; color: #f44; }
.evidence-row.ruledout .ev-label { text-decoration: line-through; color: #555; }
.ghost-entry { padding: 5px 8px; margin-bottom: 4px; font-size: 13px; color: #aaa; cursor: pointer; }
.ghost-entry.eliminated { text-decoration: line-through; color: #444; }
.ghost-entry.candidate { color: #fff; border-left: 2px solid #c33; }
.ghost-entry.sole-candidate { color: #f88; animation: pulse 1.5s infinite; }
#journal-submit { margin-top: 20px; background: #c33; color: #fff; border: none; padding: 10px 24px; font-size: 14px; cursor: pointer; font-family: 'Courier New', monospace; }
#journal-submit:disabled { background: #444; cursor: default; }
#journal-close { position: absolute; top: 20px; right: 30px; background: none; border: none; color: #888; font-size: 22px; cursor: pointer; }
#map-tablet { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: none; z-index: 50; align-items: center; justify-content: center; pointer-events: all; }
#map-canvas { border: 1px solid #333; }
#map-close { position: absolute; top: 20px; right: 30px; background: none; border: none; color: #888; font-size: 22px; cursor: pointer; }
#death-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 80; }
#death-screen h1 { color: #c33; font-size: 48px; letter-spacing: 6px; }
#death-screen p { color: #888; font-size: 14px; }
#end-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 90; text-align: center; }

#end-screen h1.win { color: #4f4; }
#end-screen h1.lose { color: #c33; }
#end-screen p { color: #888; font-size: 14px; }
#end-screen .reveal { color: #ccc; font-size: 15px; }
#frost-vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(120,180,255,0.18) 100%); pointer-events: none; z-index: 5; opacity: 0; transition: opacity 1.5s; }
#nv-overlay { position: fixed; inset: 0; background: rgba(0,30,0,0.25); mix-blend-mode: multiply; pointer-events: none; z-index: 6; opacity: 0; transition: opacity 0.3s; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
</style>

// ── House data ───────────────────────────────────────────────────────────────
const ROOMS = [
  { id:'van',             name:'Investigation Van',  type:'vehicle',  floor:'ground',   bounds:{min:{x:-5,y:0,z:4},     max:{x:5,y:3,z:14}},     closetPos:{x:4.3,y:1.7,z:13.3},     connections:['foyer'], isGhostEligible:false, isSafeZone:true },

  { id:'living_room',     name:'Living Room',       type:'lounge',   floor:'ground',   bounds:{min:{x:-12,y:0,z:-4},   max:{x:-4,y:3,z:4}},     closetPos:{x:-11.3,y:1.7,z:3.3},    connections:['foyer','study'], isGhostEligible:true },
  { id:'study',           name:'Study',             type:'office',   floor:'ground',   bounds:{min:{x:-20,y:0,z:-2},   max:{x:-12,y:3,z:4}},    closetPos:{x:-19.3,y:1.7,z:3.3},    connections:['living_room'], isGhostEligible:true },
  { id:'dining_room',     name:'Dining Room',       type:'dining',   floor:'ground',   bounds:{min:{x:4,y:0,z:-4},     max:{x:12,y:3,z:4}},     closetPos:{x:4.7,y:1.7,z:3.3},      connections:['foyer','kitchen'], isGhostEligible:true },
  { id:'kitchen',         name:'Kitchen',           type:'kitchen',  floor:'ground',   bounds:{min:{x:4,y:0,z:4},      max:{x:12,y:3,z:12}},    closetPos:{x:11.3,y:1.7,z:11.3},    connections:['dining_room','pantry'], isGhostEligible:true },
  { id:'pantry',          name:'Pantry',            type:'storage',  floor:'ground',   bounds:{min:{x:12,y:0,z:5},     max:{x:18,y:3,z:11}},    closetPos:{x:17.3,y:1.7,z:10.3},    connections:['kitchen'], isGhostEligible:true },
  { id:'stairs_up',       name:'Stairs (Up)',       type:'stairwell',floor:'ground',   bounds:{min:{x:-4,y:0,z:-10},   max:{x:0,y:3,z:-4}},     closetPos:{x:-3.3,y:1.7,z:-9.3},    connections:['foyer','landing_top'], isGhostEligible:false, stairDestId:'landing_top', stairDestPos:{x:-2,y:7.7,z:-12}, stairTriggerZ:-9 },
  { id:'stairs_down',     name:'Stairs (Down)',     type:'stairwell',floor:'ground',   bounds:{min:{x:0,y:0,z:-10},    max:{x:4,y:3,z:-4}},     closetPos:{x:3.3,y:1.7,z:-9.3},     connections:['foyer','basement_landing'], isGhostEligible:false, stairDestId:'basement_landing', stairDestPos:{x:2,y:-4.3,z:-12}, stairTriggerZ:-9 },
  { id:'landing_top',     name:'Top Floor Landing', type:'hallway',  floor:'top',      bounds:{min:{x:-4,y:6,z:-16},   max:{x:4,y:9,z:-10}},    closetPos:{x:3.3,y:7.7,z:-15.3},    connections:['attic','guest_bedroom','bathroom_top','stairs_up'], isGhostEligible:false, stairDestId:'foyer', stairDestPos:{x:-2,y:1.7,z:-7}, stairTriggerZ:-10.5 },
  { id:'attic',           name:'Attic Loft',        type:'storage',  floor:'top',      bounds:{min:{x:-12,y:6,z:-22},  max:{x:-4,y:9,z:-14}},   closetPos:{x:-11.3,y:7.7,z:-21.3},  connections:['landing_top','storage_closet'], isGhostEligible:true },
  { id:'storage_closet',  name:'Storage Closet',    type:'small_room',floor:'top',     bounds:{min:{x:4,y:6,z:-22},    max:{x:10,y:9,z:-16}},   closetPos:{x:9.3,y:7.7,z:-21.3},    connections:['attic','guest_bedroom'], isGhostEligible:true },
  { id:'guest_bedroom',   name:'Guest Bedroom',     type:'bedroom',  floor:'top',      bounds:{min:{x:-12,y:6,z:-30},  max:{x:-4,y:9,z:-22}},   closetPos:{x:-11.3,y:7.7,z:-29.3},  connections:['storage_closet','landing_top'], isGhostEligible:true },

];
const ROOM_MAP = Object.fromEntries(ROOMS.map(r => [r.id, r]));
const ADJACENCY = Object.fromEntries(ROOMS.map(r => [r.id, r.connections]));
const GHOST_ELIGIBLE_ROOMS = ROOMS.filter(r => r.isGhostEligible).map(r => r.id);
const GHOST_ROOM_POOL = [...GHOST_ELIGIBLE_ROOMS, 'hidden_room'];

function findRoomAt(x, y, z) {
  return ROOMS.find(r => x >= r.bounds.min.x && x <= r.bounds.max.x && y >= r.bounds.min.y + PLAYER_HEIGHT * 0.5 && y <= r.bounds.max.y && z >= r.bounds.min.z && z <= r.bounds.max.z);
}
function roomCenter(room) {
  return { x:(room.bounds.min.x+room.bounds.max.x)/2, y:(room.bounds.min.y+room.bounds.max.y)/2, z:(room.bounds.min.z+room.bounds.max.z)/2 };
}
function bfsPath(fromId, toId) {
  if (fromId === toId) return [fromId];
  const visited = new Set([fromId]);
  const queue = [[fromId, [fromId]]];
  while (queue.length) {
    const [cur, path] = queue.shift();
    for (const next of (ADJACENCY[cur] || [])) {
      if (next === toId) return [...path, next];
      if (!visited.has(next)) { visited.add(next); queue.push([next, [...path, next]]); }
    }
  }
  return null;
}

    this._speedBonus = 0;
    this._player = { name:'Detective', position:{x:0,y:1.7,z:0}, rotation:{y:0}, sanity:100, isDead:false, isHiding:false, currentRoomId:'foyer', heldToolId:null, placedItems:[] };
    this._ghost = { position:{x:0,y:1.7,z:0}, currentRoomId:null, isVisible:false };
    this._playerLookingAtGhost = false;
    this._vanDoorLocked = false;
    this._evidence = { emf5Available:false, freezingTempsAvailable:false, fingerprintsAvailable:false, ghostOrbsAvailable:false, spiritBoxAvailable:false, writingAvailable:false, writingTriggered:false, fingerprintLocations:[] };
    this._timers = [];
    this._intervals = [];
    this._huntInterval = null;
  }

  on(event, cb) {
    if (!this._handlers[event]) this._handlers[event] = [];
    this._handlers[event].push(cb);
  }
  _emit(event, data) {
    for (const h of (this._handlers[event] || [])) h(data);
  }

  join(name) {
    this._player.name = name || 'Detective';
  }

  startGame() {
    this._phase = PHASE.INVESTIGATION;
    this._ghostType = GHOST_TYPES[Math.floor(Math.random() * GHOST_TYPES.length)];
    this._ghostRoomId = GHOST_ROOM_POOL[Math.floor(Math.random() * GHOST_ROOM_POOL.length)];
    const tools = ['emf','thermometer','goggles','uv','notebook','sensor','spiritbox'];
    this._triggerItemId = tools[Math.floor(Math.random() * tools.length)];

    const ev = this._ghostType.evidence;
    this._evidence.emf5Available          = ev.includes(EVIDENCE.EMF5);
    this._evidence.freezingTempsAvailable = ev.includes(EVIDENCE.FREEZING_TEMPS);
    this._evidence.fingerprintsAvailable  = ev.includes(EVIDENCE.FINGERPRINTS);
    this._evidence.ghostOrbsAvailable     = ev.includes(EVIDENCE.GHOST_ORBS);
    this._evidence.spiritBoxAvailable     = ev.includes(EVIDENCE.SPIRIT_BOX);
    this._evidence.writingAvailable       = ev.includes(EVIDENCE.WRITING);

    if (this._evidence.fingerprintsAvailable) this._evidence.fingerprintLocations = this._seedFingerprints();

    const gc = roomCenter(ROOM_MAP[this._ghostRoomId]);
    this._ghost.position = { x:gc.x, y:1.7, z:gc.z };
    this._ghost.currentRoomId = this._ghostRoomId;

    this._emit('game:start', { egui_triggerItemId: this._triggerItemId });
    setTimeout(() => this._emit('evidence:fingerprintLocations', this._evidence.fingerprintLocations), 200);

    this._startSanity();
    this._startEMF();
    this._startTemperature();
    this._startOrbs();
    this._scheduleWriting();
    this._startGhostWander();
    this._scheduleHunt();
  }

  _seedFingerprints() {
    const room = ROOM_MAP[this._ghostRoomId];
    const { min, max } = room.bounds;
    const fy = min.y + 1.2;
    const locs = [
      { roomId:this._ghostRoomId, worldPos:{ x:(min.x+max.x)/2, y:fy, z:min.z+0.05 } },
      { roomId:this._ghostRoomId, worldPos:{ x:(min.x+max.x)/2, y:fy, z:max.z-0.05 } },
      { roomId:this._ghostRoomId, worldPos:{ x:min.x+0.05, y:fy, z:(min.z+max.z)/2 } },
      { roomId:this._ghostRoomId, worldPos:{ x:max.x-0.05, y:fy, z:(min.z+max.z)/2 } },
    ];
    const otherRooms = ROOMS.filter(r => r.isGhostEligible && r.id !== this._ghostRoomId)
      .sort(() => Math.random() - 0.5).slice(0, 4);
    for (const r of otherRooms) {
      const { min:rm, max:rx } = r.bounds;
      locs.push({ roomId:r.id, worldPos:{ x:(rm.x+rx.x)/2, y:rm.y+1.2, z:rm.z+0.05 } });
    }
    return locs;
  }

  _startSanity() {
    const id = setInterval(() => {
      if (this._phase === PHASE.ENDED) return;
      if (this._player.isDead || this._player.isHiding) return;
      const curRoom = ROOM_MAP[this._player.currentRoomId];
      if (curRoom?.isSafeZone) {
        this._player.sanity = Math.min(100, this._player.sanity + 0.5);
        this._emit('state:sanity', { personal: this._player.sanity });
        return;
      }
      let drain = 0.3;
      if (this._ghostType?.id === 'yurei') drain += 0.2;
      if (this._ghostType?.specialAbility === 'sanityDrainOnLook' && this._phase === PHASE.HUNT && this._playerLookingAtGhost) drain += 1.5;
      this._player.sanity = Math.max(0, this._player.sanity - drain);
      this._emit('state:sanity', { personal: this._player.sanity });
    }, 1000);
    this._intervals.push(id);
  }

  _startEMF() {
    const tick = () => {
      if (this._phase === PHASE.ENDED) return;
      const t = setTimeout(() => {
        if (this._phase !== PHASE.INVESTIGATION) { tick(); return; }
        const inGhostRoom = this._player.currentRoomId === this._ghostRoomId;
        if (inGhostRoom) {
          const level = this._evidence.emf5Available && Math.random() < 0.2 ? 5 : 2;
          this._emit('evidence:emf', { level });
        } else {
          this._emit('evidence:emf', { level: 1 });
        }
        tick();
      }, 3000 + Math.random() * 2000);
      this._timers.push(t);
    };
    tick();
  }

  _startTemperature() {
    const id = setInterval(() => {
      if (this._phase === PHASE.ENDED) return;
      const inGhostRoom = this._player.currentRoomId === this._ghostRoomId;
      const temp = inGhostRoom && this._evidence.freezingTempsAvailable
        ? parseFloat((-10 + Math.random() * 15).toFixed(1))
        : parseFloat((15 + Math.random() * 5).toFixed(1));
      this._emit('evidence:temperature', { temp, roomId: this._player.currentRoomId });
    }, 2000);
    this._intervals.push(id);
  }

  _startOrbs() {
    const id = setInterval(() => {
      if (this._phase === PHASE.ENDED || !this._evidence.ghostOrbsAvailable) return;
      if (this._player.currentRoomId === this._ghostRoomId) {
        this._emit('evidence:ghostOrbs', { active: true });
        setTimeout(() => this._emit('evidence:ghostOrbs', { active: false }), 5000);
      }
    }, 10000);
    this._intervals.push(id);
  }

  _scheduleWriting() {
    const t = setTimeout(() => {
      if (this._phase === PHASE.ENDED || !this._evidence.writingAvailable || this._evidence.writingTriggered) return;
      const nbs = this._player.placedItems.filter(i => i.toolId === 'notebook' && i.roomId === this._ghostRoomId);
      if (nbs.length > 0) {
        const msgs = ['Get out',"You're next","Don't look behind you",'I see you','Leave now','RUN'];
        this._evidence.writingTriggered = true;
        this._emit('evidence:writing', { notebookId: nbs[0].notebookId, message: msgs[Math.floor(Math.random() * msgs.length)] });
      } else {
        this._scheduleWriting();
      }
    }, 25000 + Math.random() * 20000);
    this._timers.push(t);
  }

  _startGhostWander() {
    const wander = () => {
      const t = setTimeout(() => {
        if (this._phase === PHASE.ENDED) return;
        if (this._phase !== PHASE.HUNT) {
          const adj = ADJACENCY[this._ghost.currentRoomId] || [];
          if (adj.length) {
            const next = ROOM_MAP[adj[Math.floor(Math.random() * adj.length)]];
            if (next) { const c = roomCenter(next); this._ghost.position = {x:c.x,y:1.7,z:c.z}; this._ghost.currentRoomId = next.id; }
          }
        }
        wander();
      }, 20000 * (0.5 + Math.random()));
      this._timers.push(t);
    };
    wander();
  }

  _scheduleHunt() {
    const sanity = this._player.sanity;
    const interval = Math.max(30000, 120000 - ((100 - sanity) * 800));
    const wt = setTimeout(() => {
      if (this._phase !== PHASE.INVESTIGATION) return;
      this._emit('event:huntWarning', { secsRemaining: 10 });
    }, interval - 10000);
    const ht = setTimeout(() => {
      if (this._phase !== PHASE.INVESTIGATION) return;
      this._startHunt();
    }, interval);
    this._timers.push(wt, ht);
  }

  get isHuntActive() { return this._phase === PHASE.HUNT; }
  get vanDoorLocked() { return this._vanDoorLocked; }

  _startHunt() {
    this._phase = PHASE.HUNT;
    this._vanDoorLocked = true;
    this._ghost.isVisible = true;
    this._emit('event:huntStart', {});
    this._huntInterval = setInterval(() => this._huntTick(), 100);
    const curRoom = ROOM_MAP[this._player.currentRoomId];
    const huntDuration = curRoom?.isSafeZone ? 10000 : 20000;
    const t = setTimeout(() => { this._endHunt(); clearInterval(this._huntInterval); }, huntDuration);
    this._timers.push(t);
  }

  _huntTick() {
    if (this._player.isDead || this._player.isHiding) return;
    if (this._player.currentRoomId === 'van') return;
    const speed = this._computeSpeed() * 0.1;
    const gRoom = this._ghost.currentRoomId, pRoom = this._player.currentRoomId;
    if (gRoom !== pRoom) {
      const path = bfsPath(gRoom, pRoom);
      if (path && path.length > 1) {
        const nr = ROOM_MAP[path[1]];
        if (nr && nr.id !== 'van') {
          const c = roomCenter(nr);
          this._moveGhost(c, speed);
          const g = this._ghost.position;
          if (g.x >= nr.bounds.min.x && g.x <= nr.bounds.max.x && g.z >= nr.bounds.min.z && g.z <= nr.bounds.max.z) this._ghost.currentRoomId = nr.id;
        }
      }
    } else {
      this._moveGhost(this._player.position, speed);
    }
    this._emit('state:ghost', { position: this._ghost.position, isVisible: true });
    const g = this._ghost.position, p = this._player.position;
    if (Math.sqrt((g.x-p.x)**2+(g.z-p.z)**2) < 0.8) this._killPlayer();
  }

  _moveGhost(target, speed) {
    const g = this._ghost.position;
    const dx = target.x - g.x, dz = target.z - g.z;
    const len = Math.sqrt(dx*dx + dz*dz);
    if (len < 0.01) return;
    g.x += (dx/len)*speed; g.z += (dz/len)*speed;
  }

  _computeSpeed() {
    const ghost = this._ghostType;
    if (!ghost) return 1.7;
    const base = ghost.huntBehavior.baseSpeed + this._speedBonus;
    const mod = ghost.huntBehavior.speedModifier ?? 0;
    const cond = ghost.huntBehavior.modifierCondition;
    if (!cond || !mod) return base;
    switch (cond) {
      case 'powerOff': return !this._powerEnabled ? base + mod : base;
      case 'farFromPlayer': {
        const g = this._ghost.position, p = this._player.position;
        return Math.sqrt((g.x-p.x)**2+(g.z-p.z)**2) > (ghost.huntBehavior.proximityThreshold ?? 5) ? base + mod : base;
      }
      case 'playerSanityBelow30': return this._player.sanity < 30 ? base + mod : base;
      case 'playerHoldingTriggerItem': return this._player.heldToolId === this._triggerItemId ? base + mod : base;
      default: return base;
    }
  }

  _killPlayer() {
    if (this._player.isDead) return;
    this._player.isDead = true;
    this._emit('event:playerDied', { playerId:'local', name: this._player.name });
    if (this._ghostType?.specialAbility === 'permanentSpeedOnDeath') this._speedBonus += this._ghostType.huntBehavior.speedModifier;
    this._phase = PHASE.ENDED;
    this._stopAll();
    setTimeout(() => this._emit('game:ended', { result:'failure', ghostType:this._ghostType, ghostRoom:this._ghostRoomId, reason:'You were claimed by the ghost.' }), 2000);
  }

  _endHunt() {
    if (this._phase === PHASE.ENDED) return;
    this._phase = PHASE.INVESTIGATION;
    this._vanDoorLocked = false;
    this._ghost.isVisible = false;
    this._emit('event:huntEnd', {});
    this._emit('state:ghost', { position: this._ghost.position, isVisible: false });
    this._scheduleHunt();
  }

  _stopAll() {
    clearInterval(this._huntInterval);
    for (const t of this._timers) clearTimeout(t);
    for (const i of this._intervals) clearInterval(i);
  }

  sendLookingAtGhost(looking) { this._playerLookingAtGhost = looking; }
  sendMove(pos, rot, roomId) {
    this._player.position = { x:pos.x, y:pos.y, z:pos.z };
    this._player.rotation = { y:rot };
    if (roomId) this._player.currentRoomId = roomId;
  }
  sendToolHeld(toolId) { this._player.heldToolId = toolId; }
  sendHiding(hiding) { this._player.isHiding = hiding; }
  togglePower() {
    this._powerEnabled = !this._powerEnabled;
    this._emit('event:powerToggle', { enabled: this._powerEnabled });
  }
  submitGuess(ghostId) {
    if (this._phase === PHASE.ENDED) return;
    if (this._ghostType?.id === ghostId) {
      this._phase = PHASE.ENDED;
      this._stopAll();
      this._emit('game:ended', { result:'success', ghostType:this._ghostType, ghostRoom:this._ghostRoomId, solvedBy:this._player.name });
    } else {
      this._emit('game:incorrect', { guess: ghostId });
    }
  }
  askSpiritBox(questionId) {
    if (!this._evidence.spiritBoxAvailable || this._player.currentRoomId !== this._ghostRoomId) return;
    const responses = ['Leave...','Get out',"You shouldn't be here",'Help me',"I'm watching you",'Run',"You're next",'I see you','Go away'];
    setTimeout(() => this._emit('evidence:spiritBoxResponse', { response: responses[Math.floor(Math.random()*responses.length)] }), 500 + Math.random()*1000);
  }
  placeNotebook(worldPos) {
    const notebookId = `nb_${Date.now()}`;
    this._player.placedItems.push({ toolId:'notebook', roomId:this._player.currentRoomId, notebookId, worldPos });
    this._emit('evidence:notebookPlaced', { notebookId, roomId:this._player.currentRoomId, worldPos });
    this._scheduleWriting();
  }
  placeMotionSensor(worldPos) {
    const sensorId = `sensor_${Date.now()}`;
    const roomId = this._player.currentRoomId;
    this._player.placedItems.push({ toolId:'motionSensor', roomId, sensorId, worldPos });
    this._emit('evidence:sensorPlaced', { sensorId, roomId, worldPos });
    const tick = () => {
      if (this._phase === PHASE.ENDED) return;
      const t = setTimeout(() => {
        if (this._ghost.currentRoomId === roomId) {
          const dur = 1000 + Math.random()*1000;
          this._emit('evidence:motionSensor', { sensorId, active:true });
          setTimeout(() => this._emit('evidence:motionSensor', { sensorId, active:false }), dur);
        }
        tick();
      }, 5000 + Math.random()*5000);
      this._timers.push(t);
    };
    tick();
  }
}

// ── SceneManager ─────────────────────────────────────────────────────────────
class SceneManager {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x000000, 0.04);
    this.camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 120);
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 0.85;
    document.body.prepend(this.renderer.domElement);
    this._setupComposer();
    window.addEventListener('resize', () => {
      this.camera.aspect = innerWidth/innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
      this.composer.setSize(innerWidth, innerHeight);
    });
  }
  _setupComposer() {
    this.composer = new EffectComposer(this.renderer);
    this.composer.addPass(new RenderPass(this.scene, this.camera));
    const nvShader = {
      uniforms: { tDiffuse:{value:null}, uActive:{value:0.0} },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `uniform sampler2D tDiffuse; uniform float uActive; varying vec2 vUv;
        void main(){ vec4 col=texture2D(tDiffuse,vUv); float lum=dot(col.rgb,vec3(0.299,0.587,0.114)); vec3 nv=vec3(0.0,lum*2.0,0.0); gl_FragColor=vec4(mix(col.rgb,nv,uActive),col.a); }`,
    };
    this.nvPass = new ShaderPass(nvShader);
    this.composer.addPass(this.nvPass);
  }
  setNightVision(on) {
    this.nvPass.uniforms.uActive.value = on ? 1.0 : 0.0;
    document.getElementById('nv-overlay').style.opacity = on ? '1' : '0';
  }
  get nightVisionActive() { return this.nvPass.uniforms.uActive.value > 0.5; }
  render() { this.composer.render(); }
}

// ── RoomManager ──────────────────────────────────────────────────────────────
class RoomManager {
  constructor(scene) {
    this.scene = scene;
    this._currentRoomId = 'foyer';
    this._buildAll();
  }
  _buildAll() {
    const WALL_MATS = { entrance:0x2e2620, lounge:0x28201a, office:0x1e1a14, dining:0x2a2018, kitchen:0x1a1c14, storage:0x161412, hallway:0x1c1814, utility:0x121210, bedroom:0x241c18, bathroom:0x1a1c1e, small_room:0x161412, stairwell:0x141210, secret:0x100e0c };
    const FLOOR_MATS = { ground:0x2a1f14, top:0x1a1510, basement:0x111008 };
    const CEIL_MATS  = { ground:0x1c1612, top:0x141010, basement:0x0a0a08 };
    for (const room of ROOMS) {
      const { min, max } = room.bounds;
      const W = max.x-min.x, H = max.y-min.y, D = max.z-min.z;
      const cx=(min.x+max.x)/2, cy=(min.y+max.y)/2, cz=(min.z+max.z)/2;
      const wc = WALL_MATS[room.type] ?? 0x161412;
      const wm = new THREE.MeshStandardMaterial({ color:wc, roughness:0.95 });
      const fm = new THREE.MeshStandardMaterial({ color:FLOOR_MATS[room.floor]??0x2a1f14, roughness:1 });
      const cm = new THREE.MeshStandardMaterial({ color:CEIL_MATS[room.floor]??0x1c1612, roughness:1 });
      const addPlane = (w,h,mat,px,py,pz,ry) => { const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.position.set(px,py,pz); m.rotation.y=ry; this.scene.add(m); };
      const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),fm); fl.rotation.x=-Math.PI/2; fl.position.set(cx,min.y,cz); fl.receiveShadow=true; this.scene.add(fl);
      const ce=new THREE.Mesh(new THREE.PlaneGeometry(W,D),cm); ce.rotation.x=Math.PI/2; ce.position.set(cx,max.y,cz); this.scene.add(ce);
      const hasDoor=(face)=>{
        for(const cid of room.connections){ const c=ROOM_MAP[cid]; if(!c) continue; const cb=c.bounds;
          if(face==='north'&&Math.abs(cb.max.z-min.z)<0.1&&min.x<cb.max.x&&cb.min.x<max.x) return true;
          if(face==='south'&&Math.abs(cb.min.z-max.z)<0.1&&min.x<cb.max.x&&cb.min.x<max.x) return true;
          if(face==='west'&&Math.abs(cb.max.x-min.x)<0.1&&min.z<cb.max.z&&cb.min.z<max.z) return true;
          if(face==='east'&&Math.abs(cb.min.x-max.x)<0.1&&min.z<cb.max.z&&cb.min.z<max.z) return true;
        } return false;
      };
      const addWall=(w,h,hasDoor,px,py,pz,ry)=>{
        if(!hasDoor){ addPlane(w,h,wm,px,py,pz,ry); return; }
        const dw=Math.min(DOOR_WIDTH,w-0.4), dh=Math.min(DOOR_HEIGHT,h-0.1), sw=(w-dw)/2, hh=h-dh;
        if(sw>0.05){ addPlane(sw,h,wm,px-(dw/2+sw/2)*Math.cos(ry),py,pz+(dw/2+sw/2)*Math.sin(ry),ry); addPlane(sw,h,wm,px+(dw/2+sw/2)*Math.cos(ry),py,pz-(dw/2+sw/2)*Math.sin(ry),ry); }
        if(hh>0.05){ addPlane(dw,hh,wm,px,py+(h-hh)/2,pz,ry); }
      };
      addWall(W,H,hasDoor('north'),cx,cy,min.z,0);
      addWall(W,H,hasDoor('south'),cx,cy,max.z,Math.PI);
      addWall(D,H,hasDoor('west'),min.x,cy,cz,Math.PI/2);
      addWall(D,H,hasDoor('east'),max.x,cy,cz,-Math.PI/2);
      // Closet marker
      const cp=room.closetPos;
      const cm2=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.8,0.8),new THREE.MeshBasicMaterial({color:0x334433,wireframe:true}));
      cm2.position.set(cp.x,cp.y-0.1,cp.z); this.scene.add(cm2);
    }
  }
  updateCurrentRoom(x,y,z) { const r=findRoomAt(x,y,z); if(r) this._currentRoomId=r.id; return this._currentRoomId; }
  getRoomData(id) { return ROOM_MAP[id]; }
}

// ── HouseDetails ─────────────────────────────────────────────────────────────
class HouseDetails {
  constructor(scene) {
    this.scene = scene;
    this._initMaterials();
    this._buildCanvasTextures();
    this.build();
  }

  _initMaterials() {
    const M = (c,r,ex={}) => new THREE.MeshStandardMaterial({color:c,roughness:r,...ex});
    this.MAT = {
      trim:    M(0x0d0a06,0.7),
      stair:   M(0x1a1008,0.9),
      darkWood:M(0x180f05,0.85),
      aged:    M(0x231a10,0.9),
      fabric:  M(0x1c1515,1.0),
      metal:   M(0x1a1a1a,0.4,{metalness:0.7}),
      ceramic: M(0x1a1c1a,0.6),
      paper:   M(0x1e1b14,1.0,{side:THREE.DoubleSide}),
      cobweb:   M(0x888880,1.0,{transparent:true,opacity:0.22,side:THREE.DoubleSide}),
      vanMetal: M(0x2a2a2e,0.5,{metalness:0.6}),
      vanScreen:M(0x112211,0.5,{emissive:new THREE.Color(0x00aa55),emissiveIntensity:0.5}),
      vanStrip: M(0xffffff,0.1,{emissive:new THREE.Color(0xfffde8),emissiveIntensity:8.0}),
    };
  }

  _buildCanvasTextures() {
    this.TEX = {};
    const wc=document.createElement('canvas'); wc.width=wc.height=256;
    const wx=wc.getContext('2d');
    wx.fillStyle='#2a1f14'; wx.fillRect(0,0,256,256);
    wx.strokeStyle='#1a1208'; wx.lineWidth=2;
    for(let i=0;i<8;i++){const y=(i+.5)*32;wx.beginPath();wx.moveTo(0,y);wx.lineTo(256,y);wx.stroke();}
    wx.strokeStyle='#321a0a'; wx.lineWidth=0.8;
    for(let i=0;i<30;i++){const y=Math.random()*256;wx.beginPath();wx.moveTo(0,y);wx.lineTo(256,y);wx.stroke();}
    this.TEX.floor=new THREE.CanvasTexture(wc);
    this.TEX.floor.wrapS=this.TEX.floor.wrapT=THREE.RepeatWrapping;
    this.TEX.floor.repeat.set(4,4);
    const pc=document.createElement('canvas'); pc.width=pc.height=256;
    const px=pc.getContext('2d'),pd=px.createImageData(256,256);
    for(let i=0;i<pd.data.length;i+=4){const v=28+Math.random()*14;pd.data[i]=v|0;pd.data[i+1]=(v*.84)|0;pd.data[i+2]=(v*.68)|0;pd.data[i+3]=255;}
    px.putImageData(pd,0,0);
    this.TEX.plaster=new THREE.CanvasTexture(pc);
    this.TEX.plaster.wrapS=this.TEX.plaster.wrapT=THREE.RepeatWrapping;
    this.TEX.plaster.repeat.set(3,2);
    const bc=document.createElement('canvas'); bc.width=256; bc.height=128;
    const bx=bc.getContext('2d');
    bx.fillStyle='#1a1210'; bx.fillRect(0,0,256,128);
    bx.fillStyle='#0c0908';
    for(let row=0;row<8;row++){bx.fillRect(0,row*16,256,2);const off=(row%2)*32;for(let col=0;col<5;col++)bx.fillRect(col*64+off,row*16,2,16);}
    this.TEX.brick=new THREE.CanvasTexture(bc);
    this.TEX.brick.wrapS=this.TEX.brick.wrapT=THREE.RepeatWrapping;
    this.TEX.brick.repeat.set(4,2);
  }

  _box(w,h,d,mat,x,y,z,ry=0,shadow=true) {
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z); if(ry)m.rotation.y=ry;
    m.castShadow=shadow; m.receiveShadow=true; this.scene.add(m); return m;
  }
  _cyl(rt,rb,h,segs,mat,x,y,z) {
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segs),mat);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; this.scene.add(m); return m;
  }

  build() {
    for(const room of ROOMS) {
      if(room.id==='van') { this._furnishVan(room); continue; }
      if(room.type!=='stairwell') {
        this._addTrim(room);
        this._addDoorFrames(room);
        this._addFurniture(room);
        this._addTextureOverlays(room);
      }
      if(room.type==='storage'||room.type==='secret') this._addAtmospherics(room);
    }
    this._addStairs();
    this._addLightFixtures();
    this._addFoyerLights();
    this._buildVanExterior();
    this._buildStreetScene();
  }

  _furnishVan(room) {
    const {min,max}=room.bounds;
    const W=max.x-min.x, H=max.y-min.y, D=max.z-min.z;
    const cx=(min.x+max.x)/2, cz=(min.z+max.z)/2;
    const SL=this.MAT.vanStrip;
    const M=(c,r,ex={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,...ex});

    // Woody palette
    const pineM   = M(0x9C6B3C,0.9);                          // pine — main wall panels
    const cedarM  = M(0xB07D4A,0.85);                          // cedar — ceiling
    const walnutM = M(0x4A2E12,0.95);                          // walnut — battens & accents
    const oakM    = M(0x5C3A1A,0.95);                          // dark oak — shelves & arches
    const doorM   = M(0x8B5E30,0.9);                           // medium pine — door panels
    const brassM  = M(0x8B6914,0.3,{metalness:0.75});          // brass — handles
    const screenM = M(0x0d2010,0.5,{emissive:new THREE.Color(0x00aa55),emissiveIntensity:0.5});

    const plane=(geo,mat,px,py,pz,rx=0,ry=0)=>{
      const m=new THREE.Mesh(geo,mat); m.position.set(px,py,pz);
      m.rotation.x=rx; m.rotation.y=ry; m.receiveShadow=true; this.scene.add(m);
    };

    // --- Wood panel walls ---
    plane(new THREE.PlaneGeometry(D,H), pineM,  min.x+0.04, min.y+H/2, cz, 0,  Math.PI/2);  // left
    plane(new THREE.PlaneGeometry(D,H), pineM,  max.x-0.04, min.y+H/2, cz, 0, -Math.PI/2);  // right
    plane(new THREE.PlaneGeometry(W,D), cedarM, cx, max.y-0.04, cz, Math.PI/2, 0);           // ceiling
    plane(new THREE.PlaneGeometry(W,H), pineM,  cx, min.y+H/2, max.z-0.04, 0, Math.PI);      // back partition
    // Wood plank floor using canvas texture
    const floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(W,D),
      new THREE.MeshStandardMaterial({map:this.TEX.floor, roughness:0.95}));
    floorMesh.position.set(cx,min.y+0.01,cz); floorMesh.rotation.x=-Math.PI/2;
    floorMesh.receiveShadow=true; this.scene.add(floorMesh);

    // --- Horizontal plank battens on side walls (wood-paneling look) ---
    for(let y=0.38; y<=H-0.15; y+=0.38){
      this._box(D,0.045,0.05, walnutM, min.x+0.06, min.y+y, cz, 0,false);
      this._box(D,0.045,0.05, walnutM, max.x-0.06, min.y+y, cz, 0,false);
    }
    // Ceiling planks running along length
    for(let z=min.z+0.45; z<max.z; z+=0.85){
      this._box(W,0.045,0.05, walnutM, cx, max.y-0.06, z, 0,false);
    }
    // Corner pilasters (vertical trim where walls meet ceiling)
    this._box(0.06,H,0.06, walnutM, min.x+0.06, min.y+H/2, min.z+0.06, 0,false);
    this._box(0.06,H,0.06, walnutM, max.x-0.06, min.y+H/2, min.z+0.06, 0,false);
    this._box(0.06,H,0.06, walnutM, min.x+0.06, min.y+H/2, max.z-0.06, 0,false);
    this._box(0.06,H,0.06, walnutM, max.x-0.06, min.y+H/2, max.z-0.06, 0,false);

    // --- Rear double doors (z = min.z, opens toward foyer) ---
    this._box(W/2-0.09,H-0.09,0.08, doorM, cx-W/4, min.y+H/2, min.z+0.05, 0,false); // left panel
    this._box(W/2-0.09,H-0.09,0.08, doorM, cx+W/4, min.y+H/2, min.z+0.05, 0,false); // right panel
    // Horizontal rails on each door
    for(const dxSign of [-1,1]){
      const dx=cx+dxSign*W/4;
      this._box(W/2-0.14,0.07,0.07, walnutM, dx, min.y+0.28,   min.z+0.1, 0,false);
      this._box(W/2-0.14,0.07,0.07, walnutM, dx, min.y+H/2,    min.z+0.1, 0,false);
      this._box(W/2-0.14,0.07,0.07, walnutM, dx, min.y+H-0.28, min.z+0.1, 0,false);
    }
    // Centre divider + top rail
    this._box(0.09,H,0.09,    walnutM, cx,       min.y+H/2, min.z+0.07, 0,false);
    this._box(W,   0.09,0.09, walnutM, cx,       max.y-0.05,min.z+0.07, 0,false);
    // Brass handles
    this._box(0.07,0.24,0.08, brassM, cx-0.22, min.y+H/2, min.z+0.16, 0,false);
    this._box(0.07,0.24,0.08, brassM, cx+0.22, min.y+H/2, min.z+0.16, 0,false);

    // --- Cab partition pass-through window ---
    this._box(1.5,0.62,0.07, M(0x1c2a1c,0.3), cx, min.y+H-0.82, max.z-0.05, 0,false);

    // --- Wooden overhead shelves above tool rows ---
    this._box(0.9,0.07,4.8, oakM, min.x+1.15,2.65,8.75, 0,false);
    this._box(0.9,0.07,4.8, oakM, max.x-1.15,2.65,8.75, 0,false);
    for(let z=6.5; z<=11; z+=2.25){
      this._box(0.06,0.48,0.06, oakM, min.x+0.70,2.42,z, 0,false);
      this._box(0.06,0.48,0.06, oakM, max.x-0.70,2.42,z, 0,false);
    }

    // --- Wheel arches (oak) ---
    this._box(0.45,0.45,2.2, oakM, min.x+0.22,0.23,12.0, 0,false);
    this._box(0.45,0.45,2.2, oakM, max.x-0.22,0.23,12.0, 0,false);

    // --- Entrance step ---
    this._box(2.2,0.15,0.4, oakM, cx,0.15,min.z+0.3, 0,false);

    // --- Back-wall command desk (dark oak) ---
    this._box(3.2,0.08,0.85, oakM,    cx,1.15,max.z-0.5,  0,true);
    this._box(0.1,0.7,0.1,   oakM,    cx,1.55,max.z-0.56, 0,false);
    this._box(1.72,1.12,0.06,walnutM, cx,2.1, max.z-0.12, 0,false);   // monitor frame
    this._box(1.6, 1.0, 0.04,screenM, cx,2.1, max.z-0.10, 0,false);   // screen

    // --- Ceiling strip lights framed in cedar ---
    this._box(4.4,0.09,0.42, cedarM, cx,max.y-0.05,7.4,  0,false); // frame
    this._box(4.4,0.09,0.42, cedarM, cx,max.y-0.05,11.6, 0,false);
    this._box(4.0,0.04,0.28, SL,     cx,max.y-0.02,7.4,  0,false); // emissive panel
    this._box(4.0,0.04,0.28, SL,     cx,max.y-0.02,11.6, 0,false);

    // Warm amber point lights (no flicker — safe zone)
    const l1=new THREE.PointLight(0xffeecc,28.0,25,2);
    l1.position.set(cx,max.y-0.18,6.0);  this.scene.add(l1);
    const l2=new THREE.PointLight(0xffeecc,28.0,25,2);
    l2.position.set(cx,max.y-0.18,9.0);  this.scene.add(l2);
    const l3=new THREE.PointLight(0xffeecc,28.0,25,2);
    l3.position.set(cx,max.y-0.18,12.5); this.scene.add(l3);
    // Fill light at waist height to kill floor shadows
    const lf=new THREE.PointLight(0xfff5e0,6.0,18,2);
    lf.position.set(cx,1.2,9.0); this.scene.add(lf);
  }

  _addFoyerLights() {
    const room = ROOM_MAP['foyer'];
    const {min,max} = room.bounds;
    const cx=(min.x+max.x)/2, cz=(min.z+max.z)/2;
    const lights = [];
    const addL=(x,y,z,intensity,range)=>{
      const l=new THREE.PointLight(0xffcc88,intensity,range,2);
      l.position.set(x,y,z); this.scene.add(l);
      lights.push({l,base:intensity});
    };
    // 3 ceiling lights spread across foyer (matching van layout)
    addL(cx, max.y-0.18, min.z+1.5, 28, 25);
    addL(cx, max.y-0.18, cz,        28, 25);
    addL(cx, max.y-0.18, max.z-1.5, 28, 25);
    // Fill light at waist height
    addL(cx, 1.2, cz, 6, 18);
    // Slow blink: off for ~150ms every 3–4 seconds
    const blink=()=>{
      setTimeout(()=>{
        lights.forEach(({l})=>l.intensity=0);
        setTimeout(()=>{
          lights.forEach(({l,base})=>l.intensity=base);
          blink();
        }, 130+Math.random()*100);
      }, 3000+Math.random()*1000);
    };
    blink();
  }

  _addLightFixtures() {
    const M=(c,r,ex={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,...ex});
    const roseM=this.MAT.trim;
    const cordM=M(0x1c1a18,0.5,{metalness:0.3});
    const bulbM=M(0xfff9e0,0.1,{emissive:new THREE.Color(0xffcc44),emissiveIntensity:2.5});
    const shadeM=M(0x0d0a06,0.85);
    for(const room of ROOMS){
      if(room.id==='van') continue;
      if(room.type==='stairwell') continue;
      const{min,max}=room.bounds;
      const cx=(min.x+max.x)/2,cz=(min.z+max.z)/2,cy=max.y;
      this._cyl(0.1,0.1,0.04,8,roseM,cx,cy-0.02,cz);
      this._cyl(0.008,0.008,0.28,4,cordM,cx,cy-0.17,cz);
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,5),bulbM);
      bulb.position.set(cx,cy-0.34,cz); this.scene.add(bulb);
      const shade=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.08,0.22,8,1,true),shadeM);
      shade.position.set(cx,cy-0.42,cz); this.scene.add(shade);
    }
  }

  _buildVanExterior() {
    const M=(c,r,ex={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,...ex});
    const bodyM=M(0x23232b,0.5,{metalness:0.4});
    const cabM =M(0x1b1b23,0.5,{metalness:0.4});
    const glassM=M(0x081412,0.2,{metalness:0.2,transparent:true,opacity:0.55});
    const wheelM=M(0x0a0a0a,0.95);
    const rimM  =M(0x282828,0.4,{metalness:0.7});
    const addFace=(w,h,mat,px,py,pz,ry=0)=>{
      const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
      m.position.set(px,py,pz); m.rotation.y=ry; this.scene.add(m);
    };
    // Van room: x:-5 to 5, y:0 to 3, z:4 to 14
    addFace(10,3.4,bodyM,-5.5,1.7,9,-Math.PI/2);    // left side
    addFace(10,3.4,bodyM, 5.5,1.7,9, Math.PI/2);    // right side
    addFace(11,3.4,bodyM, 0,1.7,3.8,Math.PI);       // rear (north face, shows tail lights)
    this._box(11.2,0.3,10.4,bodyM,0,3.28,9,0,false); // roof
    // Cab section (z:14 to 17.6) — driver area, slightly taller
    this._box(11.2,3.9,3.6,cabM,0,1.95,15.8,0,false);
    addFace(10.5,2.5,glassM,0,2.2,17.7,Math.PI);         // windshield
    addFace(1.6,1.3,glassM,-5.6,2.2,15.8,-Math.PI/2);   // left window
    addFace(1.6,1.3,glassM, 5.6,2.2,15.8, Math.PI/2);   // right window
    // Wheels
    for(const[wx,wz]of[[-5.4,6.5],[-5.4,11.5],[5.4,6.5],[5.4,11.5]]){
      const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.65,0.4,12),wheelM);
      wh.rotation.z=Math.PI/2; wh.position.set(wx,0.65,wz); this.scene.add(wh);
      const ri=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.42,8),rimM);
      ri.rotation.z=Math.PI/2; ri.position.set(wx,0.65,wz); this.scene.add(ri);
    }
    // Headlights
    const headM=M(0xffeecc,0.1,{emissive:new THREE.Color(0xffeedd),emissiveIntensity:1.5});
    this._box(0.55,0.3,0.08,headM,-3.2,1.9,17.7,0,false);
    this._box(0.55,0.3,0.08,headM, 3.2,1.9,17.7,0,false);
    // Tail lights
    const tailM=M(0x880000,0.1,{emissive:new THREE.Color(0xff2200),emissiveIntensity:1.0});
    this._box(0.55,0.25,0.08,tailM,-3.2,2.5,3.85,0,false);
    this._box(0.55,0.25,0.08,tailM, 3.2,2.5,3.85,0,false);
  }

  _buildStreetScene() {
    const M=(c,r,ex={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,...ex});

    const asphaltM =M(0x0d0d11,0.9);
    const concreteM=M(0x181818,0.85);
    const extWallM =M(0x1c1510,0.95);
    const roofM    =M(0x0e0b08,0.97);

      const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
      m.rotation.x=-Math.PI/2; m.position.set(px,py,pz);

    // Ground

    this._box(0.08,0.04,7,lineM, 4.5,0.02,17.5,0,false);

    // South sidewalk (z:22 to 24)

    // Road (z:24 to 32)
    flat(80,8,asphaltM,0,0.01,28);
    const dashM=M(0x3a3a28,0.9);

    this._box(80,0.12,0.2,M(0x1a1a1a,0.9),0,0.06,33.9,0,false);

      this._box(1.4,1.0,0.08,winM,hx+hw/4,2.5,36.05,0,false);

    }
    // Street lamps (south side of road, z≈22.8)

    for(const lx of[-18,-6,6,18]){

      this._box(1.4,0.08,0.08,poleM,lx+0.7,4.55,22.8,0,false);
      this._box(0.6,0.22,0.32,lampHeadM,lx+1.4,4.5,22.8,0,false);

    this._box(8, 3,0.2,extWallM,-8,1.5,-4.1, 0,false); // north-west (living rm)
    this._box(8, 3,0.2,extWallM, 8,1.5,-4.1, 0,false); // north-east (dining rm)
    this._box(0.2,3,8, extWallM,-20.1,1.5,0,  0,false); // west (study)
    this._box(0.2,3,16,extWallM, 12.1,1.5,4,  0,false); // east (kitchen/dining)
    this._box(8,  3,0.2,extWallM,8,1.5,12.1,  0,false); // south (kitchen)
    // Roofs
    this._box(40,0.3,26,roofM,-1,3.12,0,  0,false); // ground floor
    this._box(16,0.3,20,roofM,-8,9.12,-20,0,false); // top floor
  }

  _addTrim(room) {
    const {min,max}=room.bounds, T=this.MAT.trim;
    const W=max.x-min.x, D=max.z-min.z, cx=(min.x+max.x)/2, cz=(min.z+max.z)/2;
    const fy=min.y+0.025, cy=max.y-0.025;
    this._box(W,.05,.06,T,cx,fy,min.z+.03,0,false);
    this._box(W,.05,.06,T,cx,fy,max.z-.03,0,false);
    this._box(.06,.05,D,T,min.x+.03,fy,cz,0,false);
    this._box(.06,.05,D,T,max.x-.03,fy,cz,0,false);
    this._box(W,.05,.06,T,cx,cy,min.z+.03,0,false);
    this._box(W,.05,.06,T,cx,cy,max.z-.03,0,false);
    this._box(.06,.05,D,T,min.x+.03,cy,cz,0,false);
    this._box(.06,.05,D,T,max.x-.03,cy,cz,0,false);
  }

  _addDoorFrames(room) {
    const {min,max}=room.bounds, T=this.MAT.trim, jW=.08;
    for(const cid of room.connections) {
      const c=ROOM_MAP[cid]; if(!c) continue;
      const cb=c.bounds;
      if(Math.abs(cb.max.z-min.z)<.15) {
        const x0=Math.max(min.x,cb.min.x),x1=Math.min(max.x,cb.max.x);
        if(x1>x0){const dcx=(x0+x1)/2;
          this._box(jW,DOOR_HEIGHT,jW,T,dcx-DOOR_WIDTH/2-jW/2,min.y+DOOR_HEIGHT/2,min.z,0,false);
          this._box(jW,DOOR_HEIGHT,jW,T,dcx+DOOR_WIDTH/2+jW/2,min.y+DOOR_HEIGHT/2,min.z,0,false);
          this._box(DOOR_WIDTH+jW*2,jW,jW,T,dcx,min.y+DOOR_HEIGHT+jW/2,min.z,0,false);}
      }
      if(Math.abs(cb.min.x-max.x)<.15) {
        const z0=Math.max(min.z,cb.min.z),z1=Math.min(max.z,cb.max.z);
        if(z1>z0){const dcz=(z0+z1)/2;
          this._box(jW,DOOR_HEIGHT,jW,T,max.x,min.y+DOOR_HEIGHT/2,dcz-DOOR_WIDTH/2-jW/2,0,false);
          this._box(jW,DOOR_HEIGHT,jW,T,max.x,min.y+DOOR_HEIGHT/2,dcz+DOOR_WIDTH/2+jW/2,0,false);
          this._box(jW,jW,DOOR_WIDTH+jW*2,T,max.x,min.y+DOOR_HEIGHT+jW/2,dcz,0,false);}
      }
    }
  }

  _addStairs() {
    const SM=this.MAT.stair, RM=this.MAT.metal;
    const RISE=3/8, RUN=6/8, STEPS=8;
    for(let i=0;i<STEPS;i++){const h=RISE*(i+1);this._box(4,h,RUN,SM,-2,h/2,-4-RUN/2-i*RUN);}
    const rLen=Math.sqrt(45), dir=new THREE.Vector3(0,3,-6).normalize();
    const r1=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,rLen,6),RM);
    r1.position.set(-.2,1.5,-7); r1.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    r1.castShadow=true; this.scene.add(r1);
    this._cyl(.04,.04,1,6,RM,-.2,.5,-4.5);
    this._cyl(.04,.04,1,6,RM,-.2,2.5,-9.5);
    for(let i=0;i<STEPS;i++){const h=RISE*(i+1);this._box(4,h,RUN,SM,2,h/2,-4-RUN/2-i*RUN);}
    const r2=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,rLen,6),RM);
    r2.position.set(.2,1.5,-7); r2.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    r2.castShadow=true; this.scene.add(r2);
    this._cyl(.04,.04,1,6,RM,.2,.5,-4.5);
    this._cyl(.04,.04,1,6,RM,.2,2.5,-9.5);

  _addFurniture(room) {
    ({lounge:()=>this._furnishLounge(room),office:()=>this._furnishOffice(room),
      dining:()=>this._furnishDining(room),kitchen:()=>this._furnishKitchen(room),

  _furnishLounge(room) {

    fp.receiveShadow=true; this.scene.add(fp);

  _addAtmospherics(room) {
    const {min,max}=room.bounds;
    if(room.type==='secret') {
      for(let i=0;i<4;i++){
        const pm=new THREE.Mesh(new THREE.PlaneGeometry(.35+Math.random()*.12,.26+Math.random()*.08),this.MAT.paper);
        pm.rotation.x=-Math.PI/2; pm.rotation.z=(Math.random()-.5)*.55;
        pm.position.set(min.x+1.5+Math.random()*(max.x-min.x-3),min.y+.01,min.z+1.5+Math.random()*(max.z-min.z-3));
        this.scene.add(pm);
      }
    }
    if(room.id==='attic'||room.id==='hidden_room') {
      const cp=room.closetPos;
      const cx2=cp.x<(min.x+max.x)/2?max.x:min.x;
      const cz2=cp.z<(min.z+max.z)/2?max.z:min.z;
      this._addCobweb(cx2,max.y-.05,cz2,cx2===max.x?-1:1,cz2===max.z?-1:1);
    }
    if(room.id==='attic'){
      const dl=new THREE.PointLight(0xccbbaa,.08,5,2);
      dl.position.set((min.x+max.x)/2,min.y+1.5,(min.z+max.z)/2);
      this.scene.add(dl);
    }
  }

  _addCobweb(cx,cy,cz,sx,sz) {
    for(const [dx,dz] of [[sx*.6,0],[0,sz*.6],[sx*.38,sz*.38]]) {
      const path=new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(cx,cy,cz),
        new THREE.Vector3(cx+dx*.5,cy-.12,cz+dz*.5),
        new THREE.Vector3(cx+dx,cy,cz+dz));
      const tube=new THREE.Mesh(new THREE.TubeGeometry(path,8,.005,4,false),this.MAT.cobweb);
      tube.castShadow=false; this.scene.add(tube);
    }
  }
}

// ── LightingManager ──────────────────────────────────────────────────────────
class LightingManager {
  constructor(scene) {
    this.scene = scene;
    this._lights = new Map();
    this._powerEnabled = true;
    scene.add(new THREE.AmbientLight(0x333322, 0.6));
    const colors = { ground:0xffcc88, top:0xddaacc, basement:0x88aacc };
    for (const room of ROOMS) {
      if (room.id === 'van') continue;   // van lit by HouseDetails
      if (room.id === 'foyer') continue; // foyer lit by HouseDetails with blink
      const { min,max } = room.bounds;
      const light = new THREE.PointLight(colors[room.floor]??0xffcc88, 2.5, 16, 2);
      light.position.set((min.x+max.x)/2, max.y-0.4, (min.z+max.z)/2);
      light.castShadow = false;
      light.userData.base = 2.5;
      scene.add(light);
      this._lights.set(room.id, light);
      this._scheduleFlicker(room.id);
    }
  }
  _scheduleFlicker(id) {
    const light = this._lights.get(id);
    if (!light) return;
    setTimeout(() => {
      if (!this._powerEnabled) return;
      let n = 3 + Math.floor(Math.random()*3);
      const fl = () => { if(n--<=0){this._scheduleFlicker(id);return;} light.intensity=light.intensity>0.1?0:light.userData.base; setTimeout(fl,60+Math.random()*80); };
      fl();
    }, 3000 + Math.random()*8000);
  }
  setPower(on) {
    this._powerEnabled = on;
    for (const [,l] of this._lights) l.intensity = on ? l.userData.base : 0;
    if (on) for (const id of this._lights.keys()) this._scheduleFlicker(id);
  }
}

// ── GhostRenderer ─────────────────────────────────────────────────────────────
class GhostRenderer {
  constructor(scene) {
    this._group = new THREE.Group(); this._group.visible = false; scene.add(this._group);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35,1.2,6,12), new THREE.MeshStandardMaterial({color:0xaaccff,emissive:0x334466,emissiveIntensity:0.6,transparent:true,opacity:0.55,side:THREE.DoubleSide,depthWrite:false}));
    body.position.y=0.9; this._group.add(body); this._body=body;
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.28,8,8),new THREE.MeshBasicMaterial({color:0x88aaff,transparent:true,opacity:0.3}));
    glow.position.y=1.8; this._group.add(glow);
    this._light = new THREE.PointLight(0x6688ff,0.8,5); this._light.position.y=1.0; this._group.add(this._light);
    this._target = new THREE.Vector3();
  }
  setVisible(on) { this._group.visible = on; }
  isVisible() { return this._group.visible; }
  getPosition() { return this._group.position; }
  setTarget(pos) { this._target.set(pos.x,pos.y,pos.z); }
  update(delta) {
    if (!this._group.visible) return;
    this._group.position.lerp(this._target, 0.15);
    const t = Date.now()/1000;
    this._body.position.y = 0.9 + Math.sin(t*1.3)*0.08;
    this._light.intensity = 0.7 + Math.sin(t*2.1)*0.15;
  }
}

// ── PlayerController ──────────────────────────────────────────────────────────
class PlayerController {
  constructor(camera, domElement) {
    this.camera = camera;
    this.controls = new PointerLockControls(camera, domElement);
    this.isHiding = false; this.isDead = false;
    this._keys = { w:false,a:false,s:false,d:false };
    this._lastStairTime = 0;
    this._onStairCb = null;
    this._walls = this._buildWalls();
    document.addEventListener('keydown', e => this._onKey(e,true));
    document.addEventListener('keyup',   e => this._onKey(e,false));
  }
  _onKey(e,down) {
    if(e.code==='KeyW') this._keys.w=down;
    if(e.code==='KeyA') this._keys.a=down;
    if(e.code==='KeyS') this._keys.s=down;
    if(e.code==='KeyD') this._keys.d=down;
  }
  lock() { this.controls.lock(); }
  onStairTransition(cb) { this._onStairCb = cb; }
  update(delta, curRoomId) {
    if (!this.controls.isLocked || this.isHiding || this.isDead) return;
    const dir = new THREE.Vector3();
    if(this._keys.w) dir.z-=1; if(this._keys.s) dir.z+=1;
    if(this._keys.a) dir.x-=1; if(this._keys.d) dir.x+=1;
    if(dir.lengthSq()===0) return;
    dir.normalize();
    const euler = new THREE.Euler().setFromQuaternion(this.camera.quaternion,'YXZ');
    dir.applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,euler.y,0)));
    const oldPos = this.camera.position.clone();
    const newPos = oldPos.clone().addScaledVector(dir, 4.5*delta);
    this.camera.position.copy(this._resolveCollision(oldPos, newPos));
    this._checkStairs(curRoomId);
  }
  _resolveCollision(oldPos, newPos) {
    const p = newPos.clone();
    const curRoom = findRoomAt(oldPos.x, oldPos.y, oldPos.z);
    const check = new Set();
    if (curRoom) { check.add(curRoom.id); for(const c of curRoom.connections) check.add(c); }
    else for(const r of ROOMS) check.add(r.id);
    for(const rid of check) {
      for(const wall of (this._walls.get(rid)||[])) {
        const exp = wall.clone().expandByScalar(PLAYER_RADIUS);
        if(!exp.containsPoint(p)) continue;
        const center=new THREE.Vector3(); exp.getCenter(center);
        const size=new THREE.Vector3(); exp.getSize(size);
        if(size.x/2-Math.abs(p.x-center.x) < size.z/2-Math.abs(p.z-center.z)) p.x=p.x>center.x?center.x+size.x/2:center.x-size.x/2;
        else p.z=p.z>center.z?center.z+size.z/2:center.z-size.z/2;
      }
    }
    const r = findRoomAt(p.x,p.y,p.z) || curRoom;
    if(r) p.y=Math.max(r.bounds.min.y+PLAYER_HEIGHT, Math.min(r.bounds.max.y-0.1, p.y));
    return p;
  }
  _checkStairs(curRoomId) {
    const now=Date.now(); if(now-this._lastStairTime<2000) return;
    const room=ROOM_MAP[curRoomId]; if(!room||!room.stairDestId) return;
    const pos=this.camera.position, {min,max}=room.bounds;
    const inX=pos.x>=min.x&&pos.x<=max.x;
    const goingNorth=room.stairTriggerZ<(min.z+max.z)/2;
    const triggered=inX&&(goingNorth?pos.z<=room.stairTriggerZ:pos.z>=room.stairTriggerZ);
    if(triggered){ this._lastStairTime=now; if(this._onStairCb) this._onStairCb(room.stairDestId, room.stairDestPos); }
  }
  _buildWalls() {
    const map=new Map();
    for(const room of ROOMS){
      const {min,max}=room.bounds, t=0.1, walls=[];
      const hasConn=(face)=>{
        for(const cid of room.connections){ const c=ROOM_MAP[cid]; if(!c) continue; const cb=c.bounds;
          const xO=min.x<cb.max.x&&cb.min.x<max.x, zO=min.z<cb.max.z&&cb.min.z<max.z;
          if(face==='north'&&Math.abs(cb.max.z-min.z)<0.2&&xO) return true;
          if(face==='south'&&Math.abs(cb.min.z-max.z)<0.2&&xO) return true;
          if(face==='west'&&Math.abs(cb.max.x-min.x)<0.2&&zO) return true;
          if(face==='east'&&Math.abs(cb.min.x-max.x)<0.2&&zO) return true;
        } return false;
      };
      if(!hasConn('north')) walls.push(new THREE.Box3(new THREE.Vector3(min.x,min.y,min.z-t),new THREE.Vector3(max.x,max.y,min.z+t)));
      if(!hasConn('south')) walls.push(new THREE.Box3(new THREE.Vector3(min.x,min.y,max.z-t),new THREE.Vector3(max.x,max.y,max.z+t)));
      if(!hasConn('west'))  walls.push(new THREE.Box3(new THREE.Vector3(min.x-t,min.y,min.z),new THREE.Vector3(min.x+t,max.y,max.z)));
      if(!hasConn('east'))  walls.push(new THREE.Box3(new THREE.Vector3(max.x-t,min.y,min.z),new THREE.Vector3(max.x+t,max.y,max.z)));
      map.set(room.id, walls);
    }
    return map;
  }
  enterCloset(room) { this.isHiding=true; const cp=room.closetPos; this.camera.position.set(cp.x,cp.y,cp.z); this.controls.unlock(); }

// ── Journal ───────────────────────────────────────────────────────────────────
const EVIDENCE_LABELS = { emf5:'EMF Level 5', freezingTemps:'Freezing Temperatures', fingerprints:'Fingerprints', ghostOrbs:'Ghost Orbs', spiritBox:'Spirit Box', writing:'Ghost Writing' };
class Journal {
  constructor(onSubmit) {
    this._onSubmit=onSubmit; this._states={}; this._visible=false; this._guess=null;
    for(const k of Object.values(EVIDENCE)) this._states[k]=0;
    this._el=document.getElementById('journal');
    this._buildUI();
    document.getElementById('journal-close').addEventListener('click',()=>this.hide());
    document.getElementById('journal-submit').addEventListener('click',()=>this._submit());
    document.addEventListener('keydown',e=>{ if(e.code==='KeyJ') this.toggle(); if(e.code==='Escape'&&this._visible) this.hide(); });
  }
  _buildUI() {
    const el=document.getElementById('evidence-list'); el.innerHTML='<h3>EVIDENCE</h3>';
    for(const [k,label] of Object.entries(EVIDENCE_LABELS)){
      const row=document.createElement('div'); row.className='evidence-row'; row.dataset.ev=k;
      row.innerHTML=`<div class="ev-state" id="ev-${k}">?</div><span class="ev-label">${label}</span>`;
      row.addEventListener('click',()=>this._cycle(k)); el.appendChild(row);
    }
    const gl=document.getElementById('ghost-list'); gl.innerHTML='<h3>GHOST TYPE</h3>';
    for(const g of GHOST_TYPES){
      const d=document.createElement('div'); d.className='ghost-entry'; d.id=`g-${g.id}`;
      d.textContent=g.name; d.title=g.evidence.map(e=>EVIDENCE_LABELS[e]||e).join(', ');
      d.addEventListener('click',()=>this._select(g.id)); gl.appendChild(d);
    }
  }
  _cycle(k) {
    this._states[k]=(this._states[k]+1)%3;
    const el=document.getElementById(`ev-${k}`), s=this._states[k];
    el.textContent=['?','✓','✗'][s]; el.className='ev-state '+['','confirmed','ruledout'][s];
    const row=document.querySelector(`[data-ev="${k}"]`); row.classList.toggle('ruledout',s===2);
    this._update();
  }
  _update() {
    const conf=Object.entries(this._states).filter(([,s])=>s===1).map(([k])=>k);
    const ruled=Object.entries(this._states).filter(([,s])=>s===2).map(([k])=>k);
    let cands=[];
    for(const g of GHOST_TYPES){
      const el=document.getElementById(`g-${g.id}`); if(!el) continue;
      el.classList.remove('eliminated','candidate','sole-candidate');
      const ok=conf.every(e=>g.evidence.includes(e))&&ruled.every(e=>!g.evidence.includes(e));
      if(!ok) el.classList.add('eliminated'); else { cands.push(g.id); el.classList.add('candidate'); }
    }
    if(cands.length===1){ this._guess=cands[0]; document.getElementById(`g-${cands[0]}`).classList.add('sole-candidate'); } else this._guess=null;
    document.getElementById('journal-submit').disabled=cands.length===0;
  }
  _select(id) { this._guess=id; document.querySelectorAll('.ghost-entry.candidate').forEach(e=>e.style.fontWeight=e.id===`g-${id}`?'bold':'normal'); }
  _submit() {
    if(!this._guess){
      const cands=GHOST_TYPES.filter(g=>document.getElementById(`g-${g.id}`)?.classList.contains('candidate'));
      if(cands.length>1){alert('Select a specific ghost first.');return;}
      if(cands.length===1) this._guess=cands[0].id;
    }
    if(this._guess){ this._onSubmit(this._guess); this.hide(); }
  }
  toggle() { this._visible?this.hide():this.show(); }
  show() { this._visible=true; this._el.style.display='block'; document.exitPointerLock?.(); }
  hide() { this._visible=false; this._el.style.display='none'; }
  isVisible() { return this._visible; }
}

// ── MapTablet ──────────────────────────────────────────────────────────────────
class MapTablet {
  constructor() {
    this._el=document.getElementById('map-tablet');
    this._canvas=document.getElementById('map-canvas');
    this._ctx=this._canvas.getContext('2d');
    this._sensors=new Map(); this._floor='ground'; this._visible=false;
    document.getElementById('map-close').addEventListener('click',()=>this.hide());
    document.addEventListener('keydown',e=>{ if(e.code==='KeyM') this.toggle(); if(e.code==='Escape'&&this._visible) this.hide(); });
    this._canvas.addEventListener('click',e=>this._click(e));
  }
  addSensor(id,roomId,worldPos){ this._sensors.set(id,{roomId,worldPos,active:false}); if(this._visible) this._render(); }
  setSensorActive(id,active){ const s=this._sensors.get(id); if(s) s.active=active; if(this._visible) this._render(); }
  toggle(){ this._visible?this.hide():this.show(); }
  show(){ this._visible=true; this._el.style.display='flex'; document.exitPointerLock?.(); this._render(); }
  hide(){ this._visible=false; this._el.style.display='none'; }
  _render(){
    const ctx=this._ctx,W=this._canvas.width,H=this._canvas.height;
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#080808'; ctx.fillRect(0,0,W,H);
    const rooms=ROOMS.filter(r=>r.floor===this._floor); if(!rooms.length) return;
    let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
    for(const r of rooms){ minX=Math.min(minX,r.bounds.min.x); maxX=Math.max(maxX,r.bounds.max.x); minZ=Math.min(minZ,r.bounds.min.z); maxZ=Math.max(maxZ,r.bounds.max.z); }
    const m=20, scale=Math.min((W-m*2)/(maxX-minX),(H-m*2)/(maxZ-minZ));
    const ts=(wx,wz)=>({x:m+(wx-minX)*scale,y:m+(wz-minZ)*scale});
    for(const r of rooms){
      const tl=ts(r.bounds.min.x,r.bounds.min.z),br=ts(r.bounds.max.x,r.bounds.max.z);
      ctx.strokeStyle='#2a3a2a'; ctx.lineWidth=1; ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
      ctx.fillStyle='#334433'; ctx.font='9px Courier New'; ctx.textAlign='center'; ctx.fillText(r.name,(tl.x+br.x)/2,(tl.y+br.y)/2);
    }
    for(const [,s] of this._sensors){
      const sr=ROOMS.find(r=>r.id===s.roomId); if(!sr||sr.floor!==this._floor) continue;
      const p=ts(s.worldPos?.x??(sr.bounds.min.x+sr.bounds.max.x)/2,s.worldPos?.z??(sr.bounds.min.z+sr.bounds.max.z)/2);
      ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fillStyle=s.active?'#ff3333':'#fff'; ctx.fill();
    }
    const floors=['ground','top','basement'];
    ctx.font='bold 11px Courier New'; ctx.textAlign='left';
    floors.forEach((f,i)=>{ const ly=H-10-i*18; if(f===this._floor){ctx.fillStyle='rgba(100,200,100,0.15)';ctx.fillRect(4,ly-12,76,15);} ctx.fillStyle=f===this._floor?'#7fcc7f':'#446644'; ctx.fillText(f.toUpperCase(),8,ly); });
  }
  _click(e){
    const rect=this._canvas.getBoundingClientRect(), y=(e.clientY-rect.top)*(this._canvas.height/rect.height), H=this._canvas.height;
    ['ground','top','basement'].forEach((f,i)=>{ const ly=H-10-i*18; if(y>=ly-13&&y<=ly+3){ this._floor=f; this._render(); } });
  }
}

    }
    a.needsUpdate=true;

class UVFlashlight {
  constructor(camera,scene,hud){
    this.camera=camera; this.hud=hud; this._active=false; this._fps=[];
    this._light=new THREE.SpotLight(0x9900ff,0,8,Math.PI/10,0.3);
    scene.add(this._light); scene.add(this._light.target);
    this._scene=scene;
  }
  onEquip(){ this._active=true; this.hud.setToolReadout('UV: ON'); }
  onUnequip(){ this._active=false; this._light.intensity=0; this.hud.setToolReadout(''); }
  onFingerprintLocations(locs){ for(const loc of locs) this._add(loc); }
  _add(loc){
    const mat=new THREE.MeshBasicMaterial({color:0x8800ff,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.2),mat);
    const {x,y,z}=loc.worldPos; mesh.position.set(x,y,z); mesh.lookAt(x,y+2,z+1);
    this._scene.add(mesh); this._fps.push({mesh,pos:new THREE.Vector3(x,y,z),revealed:false});
  }
  update(delta){
    if(!this._active) return;
    this._light.position.copy(this.camera.position); this._light.intensity=2.5;
    const dir=new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion);
    this._light.target.position.copy(this.camera.position.clone().addScaledVector(dir,4));
    this._light.target.updateMatrixWorld();
    const cos=Math.cos(Math.PI/10+0.2);
    for(const fp of this._fps){
      const to=fp.pos.clone().sub(this.camera.position), dist=to.length();
      if(dist>4){fp.mesh.material.opacity=Math.max(0,fp.mesh.material.opacity-delta*0.5);continue;}
      to.normalize();
      if(to.dot(dir)>cos){ fp.mesh.material.opacity=Math.min(0.9,fp.mesh.material.opacity+delta*1.5); if(!fp.revealed&&fp.mesh.material.opacity>0.3) fp.revealed=true; }
      else fp.mesh.material.opacity=Math.max(0,fp.mesh.material.opacity-delta*0.8);
    }
  }
}
