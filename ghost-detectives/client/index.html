<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Detectives</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #ccc; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* ── HUD overlay ─────────────────────────────────────────── */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.7); font-size: 22px; line-height: 1;
      text-shadow: 0 0 4px #000;
    }
    #hud-topleft {
      position: absolute; top: 14px; left: 14px;
      font-size: 13px; max-width: 340px;
    }
    #spirit-response {
      background: rgba(0,0,0,0.6);
      border-left: 2px solid #aaa;
      padding: 6px 10px;
      margin-bottom: 6px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    #evidence-popup {
      background: rgba(0,0,0,0.6);
      border-left: 2px solid #6cf;
      padding: 6px 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    #hud-topcenter {
      position: absolute; top: 14px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    #hunt-warning {
      color: #f44; font-size: 16px; font-weight: bold;
      text-shadow: 0 0 8px #f00;
      display: none;
      animation: pulse 1s infinite;
    }
    #hud-topright {
      position: absolute; top: 14px; right: 14px;
      text-align: right; font-size: 12px; color: #999;
    }
    #hud-bottom {
      position: absolute; bottom: 14px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 14px;
    }
    #sanity-block { font-size: 13px; }
    #sanity-label { color: #aaa; margin-bottom: 3px; }
    #sanity-bar-wrap {
      width: 140px; height: 8px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
    }
    #sanity-bar { height: 100%; background: #7f7; transition: width 1s, background 1s; }
    #sanity-pct { font-size: 12px; color: #7f7; margin-top: 2px; }
    #tool-bar {
      display: flex; gap: 6px;
    }
    .tool-slot {
      width: 44px; height: 44px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 10px; color: #999;
      position: relative;
    }
    .tool-slot.active { border-color: #fff; color: #fff; }
    .tool-slot .slot-key { font-size: 9px; color: #666; }
    .tool-slot .slot-name { font-size: 9px; margin-top: 1px; }
    #tool-readout {
      font-size: 12px; color: #6cf;
      margin-bottom: 4px; text-align: center;
    }
    #hud-bottomright { text-align: right; font-size: 12px; color: #999; }
    #room-name { color: #bbb; }
    #temp-display { color: #6cf; margin-top: 2px; }
    #interact-prompt {
      position: absolute; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      font-size: 13px; color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      display: none;
    }

    /* ── Lobby ───────────────────────────────────────────────── */
    #lobby {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 100;
    }
    #lobby h1 { font-size: 36px; color: #c33; letter-spacing: 4px; }
    #lobby h2 { font-size: 14px; color: #777; letter-spacing: 2px; }
    #lobby input {
      background: rgba(255,255,255,0.1);
      border: 1px solid #555; color: #eee;
      padding: 8px 14px; font-size: 15px;
      font-family: 'Courier New', monospace;
      text-align: center; width: 220px;
    }
    #lobby input:focus { outline: none; border-color: #c33; }
    #player-list { font-size: 13px; color: #888; text-align: center; min-height: 60px; }
    .lobby-btn {
      background: #c33; color: #fff; border: none;
      padding: 10px 28px; font-size: 15px; cursor: pointer;
      font-family: 'Courier New', monospace; letter-spacing: 1px;
    }
    .lobby-btn:hover { background: #e44; }
    .lobby-btn:disabled { background: #555; cursor: default; }

    /* ── Journal ─────────────────────────────────────────────── */
    #journal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      display: none; z-index: 50;
      padding: 40px; overflow-y: auto;
      pointer-events: all;
    }
    #journal h2 { color: #c33; margin-bottom: 20px; letter-spacing: 2px; font-size: 20px; }
    #journal-inner { display: flex; gap: 40px; }
    #evidence-list { flex: 1; }
    #ghost-list { flex: 1; }
    #journal h3 { color: #888; font-size: 13px; margin-bottom: 12px; letter-spacing: 1px; }
    .evidence-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px; cursor: pointer; padding: 4px;
    }
    .evidence-row:hover { background: rgba(255,255,255,0.05); }
    .ev-state {
      width: 22px; height: 22px; border: 1px solid #555;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .ev-state.confirmed { border-color: #4f4; color: #4f4; }
    .ev-state.ruledout { border-color: #f44; color: #f44; }
    .evidence-row.ruledout .ev-label { text-decoration: line-through; color: #555; }
    .ghost-entry {
      padding: 5px 8px; margin-bottom: 4px; font-size: 13px; color: #aaa;
    }
    .ghost-entry.eliminated { text-decoration: line-through; color: #444; }
    .ghost-entry.candidate { color: #fff; border-left: 2px solid #c33; }
    .ghost-entry.sole-candidate { color: #f88; animation: pulse 1.5s infinite; }
    #journal-submit {
      margin-top: 20px;
      background: #c33; color: #fff; border: none;
      padding: 10px 24px; font-size: 14px; cursor: pointer;
      font-family: 'Courier New', monospace;
    }
    #journal-submit:disabled { background: #444; cursor: default; }
    #journal-close {
      position: absolute; top: 20px; right: 30px;
      background: none; border: none; color: #888;
      font-size: 22px; cursor: pointer;
    }

    /* ── Map tablet ──────────────────────────────────────────── */
    #map-tablet {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      display: none; z-index: 50;
      align-items: center; justify-content: center;
      pointer-events: all;
    }
    #map-canvas { border: 1px solid #333; }
    #map-close {
      position: absolute; top: 20px; right: 30px;
      background: none; border: none; color: #888;
      font-size: 22px; cursor: pointer;
    }

    /* ── Death screen ────────────────────────────────────────── */
    #death-screen {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 80;
    }
    #death-screen h1 { color: #c33; font-size: 48px; letter-spacing: 6px; }
    #death-screen p { color: #888; font-size: 14px; }

    /* ── End screen ──────────────────────────────────────────── */
    #end-screen {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 90; text-align: center;
    }
    #end-screen h1 { font-size: 36px; }
    #end-screen h1.win { color: #4f4; }
    #end-screen h1.lose { color: #c33; }
    #end-screen p { color: #888; font-size: 14px; }
    #end-screen .reveal { color: #ccc; font-size: 15px; }

    /* ── Frost vignette (freezing temps) ─────────────────────── */
    #frost-vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(120,180,255,0.18) 100%);
      pointer-events: none; z-index: 5;
      opacity: 0; transition: opacity 1.5s;
    }

    /* ── Night vision overlay ────────────────────────────────── */
    #nv-overlay {
      position: fixed; inset: 0;
      background: rgba(0,30,0,0.25);
      mix-blend-mode: multiply;
      pointer-events: none; z-index: 6;
      opacity: 0; transition: opacity 0.3s;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

<!-- 3D canvas inserted by Three.js -->

<!-- Lobby -->
<div id="lobby">
  <h1>GHOST DETECTIVES</h1>
  <h2>WHITTAKER HOUSE — PARANORMAL INVESTIGATION UNIT</h2>
  <input id="name-input" maxlength="16" placeholder="Enter your name..." />
  <div id="player-list">Connecting...</div>
  <button class="lobby-btn" id="start-btn" disabled>ENTER THE HOUSE</button>
</div>

<!-- HUD -->
<div id="hud" style="display:none">
  <div id="crosshair">+</div>
  <div id="hud-topleft">
    <div id="spirit-response"></div>
    <div id="evidence-popup"></div>
  </div>
  <div id="hud-topcenter">
    <div id="hunt-warning">⚠ HUNT IN PROGRESS ⚠</div>
  </div>
  <div id="hud-topright">
    <div id="player-count"></div>
    <div id="session-id"></div>
  </div>
  <div id="hud-bottom">
    <div id="sanity-block">
      <div id="sanity-label">SANITY</div>
      <div id="sanity-bar-wrap"><div id="sanity-bar"></div></div>
      <div id="sanity-pct">100%</div>
    </div>
    <div>
      <div id="tool-readout"></div>
      <div id="tool-bar"></div>
    </div>
    <div id="hud-bottomright">
      <div id="room-name"></div>
      <div id="temp-display"></div>
    </div>
  </div>
  <div id="interact-prompt"></div>
</div>

<!-- Frost & NV overlays -->
<div id="frost-vignette"></div>
<div id="nv-overlay"></div>

<!-- Journal (J key) -->
<div id="journal">
  <button id="journal-close">✕</button>
  <h2>EVIDENCE JOURNAL</h2>
  <div id="journal-inner">
    <div id="evidence-list">
      <h3>EVIDENCE</h3>
      <!-- populated by Journal.js -->
    </div>
    <div id="ghost-list">
      <h3>GHOST TYPE</h3>
      <!-- populated by Journal.js -->
    </div>
  </div>
  <button id="journal-submit" disabled>SUBMIT IDENTIFICATION</button>
</div>

<!-- Map tablet (M key) -->
<div id="map-tablet" style="display:none">
  <button id="map-close">✕</button>
  <canvas id="map-canvas" width="600" height="500"></canvas>
</div>

<!-- Click-to-start overlay (shown after lobby, before pointer lock) -->
<div id="click-start" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:70;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;">
  <div style="color:#c33;font-size:26px;letter-spacing:4px;font-family:'Courier New',monospace;">INVESTIGATION BEGINS</div>
  <div style="color:#888;font-size:14px;font-family:'Courier New',monospace;">Click anywhere to enter the house</div>
</div>

<!-- Death screen -->
<div id="death-screen">
  <h1>YOU DIED</h1>
  <p>The ghost has claimed another soul.</p>
  <button class="lobby-btn" id="spectate-btn">Continue as Spectator</button>
</div>

<!-- End screen -->
<div id="end-screen">
  <h1 id="end-title"></h1>
  <div class="reveal" id="end-ghost"></div>
  <div class="reveal" id="end-room"></div>
  <p id="end-detail"></p>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
